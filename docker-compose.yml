services:
  web:
    build: .
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
    volumes:
      - supportdesk_data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health',timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
volumes:
  supportdesk_data:
