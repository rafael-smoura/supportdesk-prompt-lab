services:
  - type: web
    name: supportdesk-prompt-lab
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 90
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: demo
      - key: AI_MODEL
        value: demo-local
# O filesystem de planos sem disco persistente pode apagar SQLite/JSON após reinícios.
